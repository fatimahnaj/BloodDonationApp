<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <title>Blood</title>
</head>
<body id="update-inventory">
    <header>
        <div class="navbar">
            <div class="navbar-header">
                    <img src="/static/logo-heart.png" class="logo-img">
                    <a href="hospital">Blood</a>
            </div>
    
            <div class="right-navbar">
                <h1>User: {{ session['username'] }}</h1>
                <button>
                    <span>
                        <i class='bx bx-log-out bx-flip-horizontal' style='color:#ffffff'  ></i>
                    </span>
                </button>
            </div>
        </div>
    </header>

    <div class="card">
        <h1>Blood Inventory</h1>

        <form method="POST">
            <table class="inventory-table">
                <thead>
                    <tr>
                        <th>Blood Type</th>
                        <th>Rh +</th>
                        <th>Rh -</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>A</td>
                        <td><input type="number" name="A_pos" min="0"></td>
                        <td><input type="number" name="A_neg" min="0"></td>
                    </tr>
                    <tr>
                        <td>B</td>
                        <td><input type="number" name="B_pos" min="0"></td>
                        <td><input type="number" name="B_neg" min="0"></td>
                    </tr>
                    <tr>
                        <td>AB</td>
                        <td><input type="number" name="AB_pos" min="0"></td>
                        <td><input type="number" name="AB_neg" min="0"></td>
                    </tr>
                    <tr>
                        <td>O</td>
                        <td><input type="number" name="O_pos" min="0"></td>
                        <td><input type="number" name="O_neg" min="0"></td>
                    </tr>
                </tbody>
            </table>

            <button type="submit">Save update</button>
        </form>
    </div>


</body>

<style>
*{
    box-sizing: border-box;
    font-family: 'Poppins';
}

html, body, .wrapper{
    height: 100%;
}

body{
    margin: 0;
    background-color: #752f27;
    display: flex;
    justify-content: center;
    place-items: center;
}

.navbar{
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    width: 100%;
    height: 100px;
    padding: 15px 20px;
    background-color: #752f27;
    transition: 0.3s;
}

.navbar-header img{
    height: 50px;
}

.navbar-header a{
    color:#fff;
    font-size: 50px;
    text-decoration: none;
    font-weight: 600;
}

.navbar button{
    background: transparent;
    border: none;
}

.navbar h1{
    color:#fff;
    margin-top: 15px;
}

.navbar i{
    margin-left: 20px;
    font-size: 50px;
}

.right-navbar{
    display: flex;
    flex-direction: row;
}

.right-navbar:last-child{
    margin-left: auto;
}

.card{
    width: 60%;
    padding: 0px 40px 20px;
    border-radius: 1.25rem;
    background: #fff;
}

.card-body{
    display: flex;
}

.body-left{
    margin-right: 18%;
}


.card h1{
    color: #752f27;
    font-size: 40px;
}

.card label{
    color: #d4bea9;
    font-size: 15px;
    text-align: left;
    letter-spacing: 0.5px;
}

.card input{
    width: 100%;
    height: 50px;
    border: 2px solid #ebebeb;
    font-family: inherit;
    font-size: 15px;
    border-radius: 0.6rem;
    border-width: 1.15px;
    border-color: #d79f92;
    transition: all 0.375s;
}

.card button{
    width: 100%;
    height: 40px;
    border-radius: 0.6rem;
    border-width: 1.15px;
    border: none;
    color: #fff;
    background-color: #880105;
    font-size: large;
    font-weight: bold;
}

.card button:hover{
    color: #e4e0e0;
    background-color: #5f0003;
    transition: all 0.475s;
}

.inventory-table {
    width: calc(100% + 80px);
    border-collapse: collapse;
    margin-left: -40px;
    margin-bottom: 30px;
}

.inventory-table th {
    padding: 10px;
    text-align: center;
}

.inventory-table td {
    border-bottom: 1px solid #c7bdbb;
    padding: 10px;
    text-align: center;
}

.inventory-table th {
    background-color: #e2d9d8;
    color: #85675c;
}

.inventory-table input {
    width: 50%;
    height: 35px;
    text-align: center;
    border-radius: 5px;
    border: 1.5px solid #d79f92;
}

.inventory-table td:first-child,
.inventory-table th:first-child {
    width: 30%;
    padding-left: 20px;
}

</style>
</html>
