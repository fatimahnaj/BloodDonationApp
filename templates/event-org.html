<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <title>Blood</title>
</head>
<body id="event-org">
    <header>
        <div class="navbar">
            <div class="navbar-header">
                    <img src="/static/logo-heart.png" class="logo-img">
                    <a href="event-org.html">Blood Donation | Dashboard</a>
            </div>
    
            <div class="right-navbar">
                <h1>User: {{ session['username'] }}</h1>
                <button>
                    <span>
                        <a href="{{ url_for('login') }}"><i class='bx bx-log-out' style="color:white"></i></a>
                    </span>
                </button>
            </div>
        </div>
    </header>
    <div class="card">
        <form method="GET" action="{{url_for('create_event')}}">
            <h1>Blood donation event</h1>
            <h3>Create a new event for a blood donation drive event within Malaysia.</h3>
            <button type="submit">Create event</button>
        </form>
    </div>
</body>

<style>
*{
    box-sizing: border-box;
    font-family: 'Poppins';
}

html, body, .wrapper{
    height: 100%;
}

body{
    margin: 0;
    background-color: #752f27;
    display: flex;
    justify-content: center;
    place-items: center;
}

.navbar{
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    width: 100%;
    height: 100px;
    padding: 15px 20px;
    background-color: #752f27;
    transition: 0.3s;
}

.navbar-header { display: flex; align-items: center; gap: 15px; }

.navbar-header img{
    height: 50px;
}

.navbar-header a{
    color:#fff;
    font-size: 30px;
    text-decoration: none;
    font-weight: 700;
}

.navbar button{
    background: transparent;
    border: none;
}

.navbar h1{
    color:#fff;
    font-size: 25px;
    margin-top: 10px;
}

.navbar i{
    margin-left: 20px;
    font-size: 50px;
}

.right-navbar{
    display: flex;
    flex-direction: row;
}

.right-navbar:last-child{
    margin-left: auto;
}

.card{
    place-items: center;
    position: relative;
    z-index: 3;
    width: 350px;
    margin: 0 20px;
    padding: 25px 30px 44px;
    border-radius: 1.25rem;
    background: #fff;
    text-align: center;
}

.card h1{
    color: #752f27;
    font-size: 20px;
}

.card h3{
    margin: 0px 15px 70px 15px;
    color: #d4bea9;
    font-size: 15px;
    text-align: left;
    letter-spacing: 0.5px;
}

.card button{
    width: 80%;
    height: 40px;
    border-radius: 0.6rem;
    border-width: 1.15px;
    border: none;
    color: #fff;
    background-color: #880105;
    font-size: large;
    font-weight: bold;
}

.card button:hover{
    color: #e4e0e0;
    background-color: #5f0003;
    transition: all 0.475s;
}

</style>
</html>
