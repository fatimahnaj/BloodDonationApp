<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <title>Blood</title>
</head>
<body id="send-request">
    <header>
        <div class="navbar">
            <div class="navbar-header">
                    <img src="/static/logo-heart.png" class="logo-img">
                    <a href="hospital">Blood</a>
            </div>
    
            <div class="right-navbar">
                <h1>User: xxx</h1>
                <button>
                    <span>
                        <i class='bx bx-log-out bx-flip-horizontal' style='color:#ffffff'  ></i>
                    </span>
                </button>
            </div>
        </div>
    </header>

    <div class="card">
        <form method="POST" action="{{ url_for('send_request') }}">

            <h1>Urgent Blood Request</h1>
            <hr class="card-divider">

            <!-- BLOOD TYPE -->
            <div class="mcq-group">
                <label class="question">Blood Type:</label>

                <div class="options">
                    <label class="radio-item">
                        <input type="radio" name="blood_type" value="A" required> A
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="blood_type" value="B"> B
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="blood_type" value="AB"> AB
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="blood_type" value="O"> O
                    </label>
                </div>
            </div>


            <!-- RH FACTOR -->
            <div class="mcq-group">
                <label class="question">Rh Factor:</label>

                <div class="options">
                    <label class="radio-item">
                        <input type="radio" name="rh" value="+" required> Positive (+)
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="rh" value="-"> Negative (-)
                    </label>
                </div>
            </div>


            <!-- URGENCY -->
            <div class="mcq-group">
                <label class="question">Urgency Level:</label>

                <div class="options">
                    <label class="radio-item">
                        <input type="radio" name="urgency" value="critical" required> Critical
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="urgency" value="high"> High
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="urgency" value="normal"> Normal
                    </label>
                </div>
            </div>

            <button type="submit">Send Request</button>

        </form>
    </div>

</body>

<style>
*{
    box-sizing: border-box;
    font-family: 'Poppins';
}

html, body, .wrapper{
    height: 100%;
}

body{
    margin: 0;
    background-color: #752f27;
    display: flex;
    justify-content: center;
    place-items: center;
}

.navbar{
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    width: 100%;
    height: 100px;
    padding: 15px 20px;
    background-color: #752f27;
    transition: 0.3s;
}

.navbar-header img{
    height: 50px;
}

.navbar-header a{
    color:#fff;
    font-size: 50px;
    text-decoration: none;
    font-weight: 600;
}

.navbar button{
    background: transparent;
    border: none;
}

.navbar h1{
    color:#fff;
    margin-top: 15px;
}

.navbar i{
    margin-left: 20px;
    font-size: 50px;
}

.right-navbar{
    display: flex;
    flex-direction: row;
}

.right-navbar:last-child{
    margin-left: auto;
}

.card{
    width: 50%;
    padding: 0px 40px 20px;
    border-radius: 1.25rem;
    background: #fff;
}

.card-body{
    display: flex;
}

.body-left{
    margin-right: 18%;
}


.card h1{
    color: #752f27;
    font-size: 40px;
    margin-bottom: 8px;
}

.card label{
    color: #ae8279;
    font-size: 15px;
    text-align: left;
    letter-spacing: 0.5px;
}

.card input{
    width: 100%;
    height: 50px;
    border: 2px solid #ebebeb;
    font-family: inherit;
    font-size: 15px;
    padding: 0 16px;
    border-radius: 0.6rem;
    border-width: 1.15px;
    border-color: #d79f92;
    transition: all 0.375s;
    margin-bottom: 15px;
}

.card button{
    width: 100%;
    height: 40px;
    border-radius: 0.6rem;
    border-width: 1.15px;
    border: none;
    color: #fff;
    background-color: #880105;
    font-size: large;
    font-weight: bold;
}

.card button:hover{
    color: #e4e0e0;
    background-color: #5f0003;
    transition: all 0.475s;
}

.card-divider {
    border: none;
    height: 2px;
    background-color: #c9b7a9;
    margin: 15px 0;        
}

.mcq-group {
    margin-bottom: 18px;
    text-align: left;
    color: #a69382;
}

.question {
    color: #752f27;
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
}

.radio-item {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: #752f27;
    font-size: 15px;
    font-weight: 600;
}

.radio-item input[type="radio"] {
    width: 16px;
    height: 16px;
    margin: 0;
    accent-color: #880105;
}

.options {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

</style>
</html>
