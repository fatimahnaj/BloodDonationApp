<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <title>Blood</title>
</head>
<body id="login">
    <div class="logo">
      <img src="/static/logo.png" alt="Logo" />
      <h3>A central for blood donation.</h3>
    </div>
    <div class="login-card">
        <!-- Flash error messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-messages">
              {% for category, message in messages %}
                {% if category == 'error' %}
                  <div class="flash {{ category }}">{{ message }}</div>
                {% endif %}
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        <form method="POST" action="{{url_for('login')}}"class="login-form">
            <input type="text" name="username" placeholder="username">
            <input type="password" name="password" placeholder="password">
            <button type="submit" id="login">Log in</button>
            <a href="#">forgot password?</a>
            <hr>
              <button type="button" id="create_acc" onclick="window.location.href='{{url_for('register')}}'">Create new account</button>
        </form>
    </div>
</body>

<style>
*{
    box-sizing: border-box;
    font-family: 'Poppins';
}

html, body, .wrapper{
    height: 100%;
}

body{
    margin: 0;
    background-color: #752f27;
}

body#login{
    display: flex;
    flex-direction: row;
    place-items: center;
    margin: 0;
    padding: 0 24px;
}

.logo{
    padding: 0 200px;
}

.logo > h3{
    color: #fff;
    padding-left: 90px;
}

.flash-messages {
    margin-bottom: 15px;
  }

  .flash {
    padding: 10px 16px;
    border-radius: 10px;
    display: inline-block;
    font-size: 15px;
    font-weight: 500;
    background-color: #ffe6e6;
    color: #b30000;
    border: 1px solid #ff9999;
    animation: fadeIn 0.4s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

.login-card{
    position: relative;
    z-index: 3;
    width: 380px;
    margin: 0 20px;
    padding: 25px 30px 44px;
    border-radius: 1.25rem;
    background: #fff;
    text-align: center;
}

.login-form{
    width: 100%;
    margin: 0;
    display: grid;
    gap: 16px;
}

.login-form > input{
    width: 100%;
    height: 50px;
    border: 2px solid #ebebeb;
    font-family: inherit;
    font-size: 15px;
    padding: 0 16px;
    border-radius: 0.6rem;
    border-width: 1.15px;
    border-color: #d79f92;
    transition: all 0.375s;
}

.login-form > a{
    color: #d79f92;
}

.login-form > hr{
  border: none;
  height: 1px;
  background: #ccc;
  margin: 1px;
}

.login-form > button{
    width: 80%;
    height: 40px;
    border-radius: 0.6rem;
    border-width: 1.15px;
    border: none;
    color: #fff;
    margin-left: 30px;
    font-size: large;
    font-weight: bold;
}

button#login{
    background-color: #880105;
}

button#create_acc{
    background-color: #d4bea9;

}

button#login:hover{
    background-color: #5f0003;
    transition: all 0.475s;
}

button#create_acc:hover{
    background-color: #b19a84;
    transition: all 0.475s;
}

.navbar{
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    width: 100%;
    height: 100px;
    padding: 20px;
    background-color: #752f27;
    transition: 0.3s;
}

.navbar-header img{
    height: 50px;
}

.navbar-header a{
    color:#fff;
    font-size: 50px;
    text-decoration: none;
    font-weight: 600;
}

.navbar button{
    background: transparent;
    border: none;
}

.navbar i{
    font-size: 50px;
}

</style>
</html>
