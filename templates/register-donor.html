<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <title>Blood</title>
</head>
<body>
    <div class="card">
        <div class="card-body">
            <form method="post">
              <div class="card-left">
                  <h1>Donor registration</h1>
                  <h2>Part I - Account information</h2>
                  <input type="text" placeholder="email address"> <br>
                  <input type="text" placeholder="company name"> <br>
                  <input type="text" placeholder="password"> <br>
                  <input type="text" placeholder="contact number"> <br>
              </div>
      
              <div class="card-right">
                  <h2>Part II - Personal Details</h2>
                  <h3>Gender :</h3>
                  <input type="radio" name="gender" value="male" id="male">
                  <label for="male">male</label>
                  <input type="radio" name="gender" value="female" id="female">
                  <label for="female">female</label> <br>

                  <h3>Date of birth :</h3>
                  <input type="date" name="dateOfBirth" id="dateOfBirth">

                  <h3>Blood type :</h3>
                  <input type="radio" name="bloodType" value="A" id="A">
                  <label for="A">A</label>
                  <input type="radio" name="bloodType" value="B" id="B">
                  <label for="B">B</label>
                  <input type="radio" name="bloodType" value="AB" id="AB">
                  <label for="AB">AB</label>
                  <input type="radio" name="bloodType" value="O" id="O">
                  <label for="O">O</label>

                  <h3>RH Factor :</h3>
                  <input type="radio" name="rhFactor" value="pos" id="pos">
                  <label for="pos">positive (+)</label>
                  <input type="radio" name="rhFactor" value="neg" id="neg">
                  <label for="neg">negative (-)</label> <br>

                  <button type="submit">Register</button>
      
              </div>
      
            </form>
        </div>
    </div>
</body>
<style>
*{
    box-sizing: border-box;
    font-family: 'Poppins';
}

html, body, .wrapper{
    height: 100%;
}

body{
    margin: 0;
    background-color: #752f27;
    display: flex;
    justify-content: center;
    place-items: center;
}
.card{
    width: 70%;
    padding: 0px 40px 20px;
    border-radius: 1.25rem;
    background: #fff;
    text-align: center;
    padding: 30px;
    margin: 30px 20px;
}
.card-body{
    display: flex;
    flex-direction: row;
    gap: 20px;
}

.card-body form{
    display: flex;
    flex-direction: row;
    gap: 20px;
    width: 100%;
}

.card-left, .card-right{
    flex: 1;
    text-align: left;
    margin-left: 20px;
}
.card h1{
    font-size: 25px;
    color: #d79f92;
    text-decoration-line: underline;
}
.card h2{
    font-size: 20px;
    color: #d79f92;
}
.card h3{
    font-size: 18px;
    color: #ae8279;
    margin-bottom: 5px;
}
.card label{
    font-family: 'poppins';
    color: #d79f92;
}
.card-left input{
    width: 90%;
    height: 65px;
    border: 2px solid #ebebeb;
    font-family: inherit;
    font-size: 15px;
    padding: 0 16px;
    border-radius: 0.6rem;
    border-width: 1.15px;
    border-color: #d79f92;
    transition: all 0.375s;
    margin-bottom: 30px;
}
input[type="radio"]{
    accent-color: #752f27;
}
input[type="radio"]:focus {
  outline: 2px solid #c7bdbb;
}
#dateOfBirth {
    height: 45px;
    border: 2px solid #ebebeb;
    font-family: inherit;
    font-size: 15px;
    padding: 0 16px;
    border-radius: 0.6rem;
    border-width: 1.15px;
    border-color: #d79f92;
    transition: all 0.375s;
    margin-bottom: 10px;
}

.card button{
    margin-top: 35px;
    width: 30%;
    height: 40px;
    border-radius: 0.6rem;
    border-width: 1.15px;
    border: none;
    color: #fff;
    background-color: #d4bea9;
    font-size: large;
    font-weight: bold;
}

.card button:hover{
    background-color: #ab9480;
    transition: all 0.475s;
}
</style>
</html>
