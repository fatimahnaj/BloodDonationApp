<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <title>Blood</title>
</head>
<body>
    <div>
        <!-- Flash error messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-messages">
              {% for category, message in messages %}
                {% if category == 'error' %}
                  <div class="flash {{ category }}">{{ message }}</div>
                {% endif %}
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
    </div>
    <div class="card">
      <form method="POST" enctype="multipart/form-data" action="{{ url_for('reg_eventorg') }}">
        <h1>Event organizer registration</h1>
        <input type="text" placeholder="email address" name="email"> <br>
        <input type="text" placeholder="company name" name="name"> <br>
        <input type="text" placeholder="password" name="password"> <br>
        <input type="text" placeholder="contact number" name="contactnum"> <br>
        <button type="submit">Register</button>
      </form>
    </div>
</body>
<style>
*{
    box-sizing: border-box;
    font-family: 'Poppins';
}

html, body, .wrapper{
    height: 100%;
}

body{
    margin: 0;
    background-color: #752f27;
    display: flex;
    justify-content: center;
    place-items: center;
}
.card{
    width: 40%;
    padding: 0px 40px 20px;
    border-radius: 1.25rem;
    background: #fff;
    text-align: center;
    padding: 30px;
    margin: 30px 20px;
    animation: fadeIn 0.4s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }
.card h1{
    text-align: left;
    font-size: 25px;
    color: #d79f92;
    text-decoration-line: underline;
    margin-left: 20px;
    margin-bottom: 30px;
}
.card input{
    width: 90%;
    height: 65px;
    border: 2px solid #ebebeb;
    font-family: inherit;
    font-size: 15px;
    padding: 0 16px;
    border-radius: 0.6rem;
    border-width: 1.15px;
    border-color: #d79f92;
    transition: all 0.375s;
    margin-bottom: 30px;
}
.card button{
    width: 30%;
    height: 40px;
    border-radius: 0.6rem;
    border-width: 1.15px;
    border: none;
    color: #fff;
    background-color: #d4bea9;
    font-size: large;
    font-weight: bold;
}

.card button:hover{
    background-color: #ab9480;
    transition: all 0.475s;
}

.flash-messages {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    width: 90%;
    max-width: 600px;
}

.flash {
    padding: 15px;
    border-radius: 0.6rem;
    margin-bottom: 10px;
    font-weight: 500;
    animation: fadeIn 0.4s ease-in-out;
}

.flash.error {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}
</style>
</html>
